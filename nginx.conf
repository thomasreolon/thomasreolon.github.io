server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    types {
        text/html html;
        text/javascript js jsx;
        text/css css;
        image/png png;
        image/jpeg jpg jpeg;
        image/gif gif;
        image/svg+xml svg;
        application/json json;
        font/woff woff;
        font/woff2 woff2;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
